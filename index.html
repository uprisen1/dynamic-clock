<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Lockscreen Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="fullscreen-btn" aria-label="Toggle Fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
        </svg>
    </button>

    <div class="lockscreen-container">
        <div id="date">Loading date...</div>
        
        <div class="clock-wrapper">
            <span id="time-main">00:00</span>
            <span id="time-seconds">00</span>
        </div>

        <button id="music-btn" class="play-button" aria-label="Play Theme"></button>
    </div>

    <audio id="theme-song" src="pirates.mp3" loop></audio>

    <script src="script.js"></script>
</body>
</html>
